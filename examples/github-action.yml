# .github/workflows/fixlock.yml — then make "fixlock" a required status check on main
name: fixlock
on: pull_request
permissions: { contents: read, pull-requests: write }
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: fg
        run: npx --yes fixlock check --base origin/${{ github.base_ref }} --markdown report.md
      - if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with: { path: report.md, header: fixlock }

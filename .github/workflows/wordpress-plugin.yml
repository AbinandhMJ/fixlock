name: WordPress plugin
on:
  pull_request:
    paths: ['extensions/wordpress/**', '.github/workflows/wordpress-plugin.yml']
  push:
    tags: ['wordpress-v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to WordPress.org and make a GitHub release (run on a wordpress-v tag)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find extensions/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test
        run: php extensions/wordpress/tests/run.php
  plugin-check:
    # WordPress.org's own Plugin Check, in a real WordPress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: extensions/wordpress/fixlock
  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zip
        run: cd extensions/wordpress && zip -r fixlock.zip fixlock -x '*.DS_Store'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixlock-wordpress
          path: extensions/wordpress/fixlock.zip
  # Release: on a wordpress-v tag (the release bot starts this when the release PR is merged).
  # WordPress.org: once the plugin is approved, add the SVN_USERNAME and SVN_PASSWORD secrets (your
  # WordPress.org username and its SVN password, from https://profiles.wordpress.org/me/profile/edit/group/3/?screen=svn-password).
  # Until then, the release only goes to GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/wordpress-v')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      id-token: write   # signed build attestation for fixlock.zip
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version matches the tag
        id: v
        run: |
          v="${GITHUB_REF_NAME#wordpress-v}"
          grep -Eq "^ \* Version: +${v//./\\.}$" extensions/wordpress/fixlock/fixlock.php
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Deploy to WordPress.org
        id: svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: echo "ready=$([ -n "$SVN_USERNAME" ] && [ -n "$SVN_PASSWORD" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.svn.outputs.ready == 'yes'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: fixlock
          BUILD_DIR: extensions/wordpress/fixlock
          VERSION: ${{ steps.v.outputs.version }}
      - if: steps.svn.outputs.ready != 'yes'
        run: echo "::notice::Not deployed to WordPress.org (no SVN_USERNAME / SVN_PASSWORD secrets yet). The GitHub release has the zip."
      - name: Zip
        run: cd extensions/wordpress && zip -qr fixlock.zip fixlock
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extensions/wordpress/fixlock.zip
      - name: GitHub release with fixlock.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#wordpress-v}"
          cd extensions/wordpress
          awk -v h="= $v =" '$0==h{f=1;next} /^= /{f=0} f' fixlock/readme.txt > notes.md
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" fixlock.zip --clobber \
            || gh release create "$TAG" fixlock.zip --title "WordPress plugin $v" --notes-file notes.md --latest=false

# Every Monday, posts fixlock's adoption numbers (npm, PyPI, GitHub stars, VS Code Marketplace,
# Open VSX) with the change since last week to the "Weekly metrics" issue. Run it any time from
# Actions → Metrics → Run workflow. See scripts/metrics.js.
name: Metrics
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/metrics.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

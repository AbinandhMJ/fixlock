name: VS Code extension
on:
  pull_request:
    paths: ['extensions/vscode/**', 'src/**', 'bin/**']
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the VS Code Marketplace and Open VSX'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - run: npx --yes @vscode/vsce@3 package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: fixlock-vsix
          path: extensions/vscode/*.vsix
      # Publishing needs two repository secrets:
      #   VSCE_PAT – Azure DevOps token with Marketplace "Manage" scope for the "abinandhmj" publisher
      #   OVSX_PAT – Open VSX token (used by Cursor, Windsurf, VSCodium)
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0 publish *.vsix -p "$OVSX_PAT"

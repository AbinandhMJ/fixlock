# Publishes to npm with provenance when a version tag is pushed:
#   npm version minor && git push --follow-tags
# Auth is npm trusted publishing (OIDC): no token is stored anywhere. On npmjs.com, the package's
# Settings → Trusted Publisher → GitHub Actions must list user AbinandhMJ, repo fixlock, workflow
# release.yml, with "npm publish" allowed. Needs npm >= 11.5.1 (Node 24 ships it).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance / trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # never cache in release builds
      - name: npm supports trusted publishing
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm --version)"
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm publish --provenance --access public   # OIDC: no NODE_AUTH_TOKEN
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

# Any language, no install step: copy to .github/workflows/fixlock.yml,
# then make "fixlock" a required status check on main.
name: fixlock
on:
  pull_request:
  pull_request_review:        # re-run when the owner approves
    types: [submitted, dismissed]
permissions: { contents: read, pull-requests: write }
jobs:
  fixlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: AbinandhMJ/fixlock@v0.11.1

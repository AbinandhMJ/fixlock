# Copy to .github/workflows/fixlock.yml, then make "fixlock" a required status check on main.
# Runs on every PR and again when someone approves, so an owner approval turns it green.
name: fixlock
on:
  pull_request:
  pull_request_review:        # re-run when the owner approves
    types: [submitted, dismissed]
permissions: { contents: read, pull-requests: write }
jobs:
  fixlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Check locked fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # reads PR approvals
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}  # or CLICKUP_TOKEN / NOTION_TOKEN
        run: npx fixlock check --base origin/${{ github.event.pull_request.base.ref }} --notify --markdown fixlock.md
      - if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with: { path: fixlock.md, header: fixlock }

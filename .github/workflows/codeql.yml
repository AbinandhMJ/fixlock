# CodeQL: static analysis of the CLI, the GitHub App, the VS Code extension, the Python wrapper and the
# workflows themselves. Findings show in the Security tab and on pull requests.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 3'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # test/ is test harness code. js/file-access-to-http is fixlock's job (posting the PR comment,
          # the AI review it is asked for); SECURITY.md lists exactly what each feature sends.
          config: |
            paths-ignore:
              - test
              - docs/.vitepress/cache
            query-filters:
              - exclude:
                  id: js/file-access-to-http
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

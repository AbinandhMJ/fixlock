<svg xmlns="http://www.w3.org/2000/svg" width="859" height="893" viewBox="0 0 859 893" role="img" aria-label="Terminal recording of the fixlock demo: a bug fix is locked, an AI edit that would undo it is stopped, and the pull request is blocked until the owner approves."><style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;fill:#E6EDF3;white-space:pre}.b{font-weight:700}.d{opacity:.55}@keyframes k0{0%,3.96%{opacity:0}3.97%,97%{opacity:1}100%{opacity:0}}.l0{animation:k0 19.2s linear infinite}@keyframes k1{0%,4.79%{opacity:0}4.80%,97%{opacity:1}100%{opacity:0}}.l1{animation:k1 19.2s linear infinite}@keyframes k2{0%,5.05%{opacity:0}5.06%,97%{opacity:1}100%{opacity:0}}.l2{animation:k2 19.2s linear infinite}@keyframes k3{0%,10.78%{opacity:0}10.79%,97%{opacity:1}100%{opacity:0}}.l3{animation:k3 19.2s linear infinite}@keyframes k4{0%,13.38%{opacity:0}13.39%,97%{opacity:1}100%{opacity:0}}.l4{animation:k4 19.2s linear infinite}@keyframes k5{0%,14.21%{opacity:0}14.22%,97%{opacity:1}100%{opacity:0}}.l5{animation:k5 19.2s linear infinite}@keyframes k6{0%,15.04%{opacity:0}15.05%,97%{opacity:1}100%{opacity:0}}.l6{animation:k6 19.2s linear infinite}@keyframes k7{0%,15.30%{opacity:0}15.31%,97%{opacity:1}100%{opacity:0}}.l7{animation:k7 19.2s linear infinite}@keyframes k8{0%,21.03%{opacity:0}21.04%,97%{opacity:1}100%{opacity:0}}.l8{animation:k8 19.2s linear infinite}@keyframes k9{0%,21.86%{opacity:0}21.87%,97%{opacity:1}100%{opacity:0}}.l9{animation:k9 19.2s linear infinite}@keyframes k10{0%,22.70%{opacity:0}22.71%,97%{opacity:1}100%{opacity:0}}.l10{animation:k10 19.2s linear infinite}@keyframes k11{0%,23.53%{opacity:0}23.54%,97%{opacity:1}100%{opacity:0}}.l11{animation:k11 19.2s linear infinite}@keyframes k12{0%,24.36%{opacity:0}24.37%,97%{opacity:1}100%{opacity:0}}.l12{animation:k12 19.2s linear infinite}@keyframes k13{0%,29.05%{opacity:0}29.06%,97%{opacity:1}100%{opacity:0}}.l13{animation:k13 19.2s linear infinite}@keyframes k14{0%,29.88%{opacity:0}29.89%,97%{opacity:1}100%{opacity:0}}.l14{animation:k14 19.2s linear infinite}@keyframes k15{0%,30.71%{opacity:0}30.72%,97%{opacity:1}100%{opacity:0}}.l15{animation:k15 19.2s linear infinite}@keyframes k16{0%,31.55%{opacity:0}31.56%,97%{opacity:1}100%{opacity:0}}.l16{animation:k16 19.2s linear infinite}@keyframes k17{0%,32.38%{opacity:0}32.39%,97%{opacity:1}100%{opacity:0}}.l17{animation:k17 19.2s linear infinite}@keyframes k18{0%,33.21%{opacity:0}33.22%,97%{opacity:1}100%{opacity:0}}.l18{animation:k18 19.2s linear infinite}@keyframes k19{0%,33.47%{opacity:0}33.48%,97%{opacity:1}100%{opacity:0}}.l19{animation:k19 19.2s linear infinite}@keyframes k20{0%,39.20%{opacity:0}39.21%,97%{opacity:1}100%{opacity:0}}.l20{animation:k20 19.2s linear infinite}@keyframes k21{0%,41.80%{opacity:0}41.81%,97%{opacity:1}100%{opacity:0}}.l21{animation:k21 19.2s linear infinite}@keyframes k22{0%,42.63%{opacity:0}42.64%,97%{opacity:1}100%{opacity:0}}.l22{animation:k22 19.2s linear infinite}@keyframes k23{0%,43.47%{opacity:0}43.48%,97%{opacity:1}100%{opacity:0}}.l23{animation:k23 19.2s linear infinite}@keyframes k24{0%,44.30%{opacity:0}44.31%,97%{opacity:1}100%{opacity:0}}.l24{animation:k24 19.2s linear infinite}@keyframes k25{0%,45.13%{opacity:0}45.14%,97%{opacity:1}100%{opacity:0}}.l25{animation:k25 19.2s linear infinite}@keyframes k26{0%,45.39%{opacity:0}45.40%,97%{opacity:1}100%{opacity:0}}.l26{animation:k26 19.2s linear infinite}@keyframes k27{0%,51.12%{opacity:0}51.13%,97%{opacity:1}100%{opacity:0}}.l27{animation:k27 19.2s linear infinite}@keyframes k28{0%,53.72%{opacity:0}53.73%,97%{opacity:1}100%{opacity:0}}.l28{animation:k28 19.2s linear infinite}@keyframes k29{0%,54.55%{opacity:0}54.56%,97%{opacity:1}100%{opacity:0}}.l29{animation:k29 19.2s linear infinite}@keyframes k30{0%,55.39%{opacity:0}55.40%,97%{opacity:1}100%{opacity:0}}.l30{animation:k30 19.2s linear infinite}@keyframes k31{0%,56.22%{opacity:0}56.23%,97%{opacity:1}100%{opacity:0}}.l31{animation:k31 19.2s linear infinite}@keyframes k32{0%,57.05%{opacity:0}57.06%,97%{opacity:1}100%{opacity:0}}.l32{animation:k32 19.2s linear infinite}@keyframes k33{0%,57.31%{opacity:0}57.32%,97%{opacity:1}100%{opacity:0}}.l33{animation:k33 19.2s linear infinite}@keyframes k34{0%,63.04%{opacity:0}63.05%,97%{opacity:1}100%{opacity:0}}.l34{animation:k34 19.2s linear infinite}@keyframes k35{0%,63.87%{opacity:0}63.88%,97%{opacity:1}100%{opacity:0}}.l35{animation:k35 19.2s linear infinite}@keyframes k36{0%,64.71%{opacity:0}64.72%,97%{opacity:1}100%{opacity:0}}.l36{animation:k36 19.2s linear infinite}@keyframes k37{0%,65.54%{opacity:0}65.55%,97%{opacity:1}100%{opacity:0}}.l37{animation:k37 19.2s linear infinite}@keyframes k38{0%,65.80%{opacity:0}65.81%,97%{opacity:1}100%{opacity:0}}.l38{animation:k38 19.2s linear infinite}@keyframes k39{0%,72.05%{opacity:0}72.06%,97%{opacity:1}100%{opacity:0}}.l39{animation:k39 19.2s linear infinite}@keyframes k40{0%,72.31%{opacity:0}72.32%,97%{opacity:1}100%{opacity:0}}.l40{animation:k40 19.2s linear infinite}@keyframes k41{0%,73.14%{opacity:0}73.15%,97%{opacity:1}100%{opacity:0}}.l41{animation:k41 19.2s linear infinite}@keyframes k42{0%,73.97%{opacity:0}73.98%,97%{opacity:1}100%{opacity:0}}.l42{animation:k42 19.2s linear infinite}</style><rect width="859" height="893" rx="12" fill="#0E1116"/><rect x=".5" y=".5" width="858" height="892" rx="12" fill="none" stroke="#2A313C"/><circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/><text class="t d" x="429.5" y="24" text-anchor="middle">npx @abinandhmj/fixlock demo</text><text class="t l0" x="22" y="52" xml:space="preserve"><tspan class="b">fixlock demo</tspan><tspan class="d"> — what happens when an AI undoes a bug fix</tspan></text><text class="t l1" x="22" y="71" xml:space="preserve"><tspan class="d">A throwaway repo in /tmp/fixlock-demo-k3x9. Nothing in your projects is touched.</tspan></text><text class="t l2" x="22" y="90" xml:space="preserve"></text><text class="t l3" x="22" y="109" xml:space="preserve"><tspan fill="#B8F23A" class="b">1</tspan> <tspan class="b">Abi fixes a bug: SAP rejects ISO timestamps, so dates must be sent as yyyy-MM-dd</tspan></text><text class="t l4" x="22" y="128" xml:space="preserve">   <tspan fill="#79C0FF">$</tspan> git commit -m "fix(ENG-12): send SAP DocDate as yyyy-MM-dd"</text><text class="t l5" x="22" y="147" xml:space="preserve">   <tspan class="d">│</tspan> <tspan fill="#B8F23A">🔒 FIX-001 auto-locked — src/sap/date.ts (2 lines) · send SAP DocDate as yyyy-MM-dd · linear:ENG-12</tspan></text><text class="t l6" x="22" y="166" xml:space="preserve"><tspan class="d">   The post-commit hook locked the lines that fixed the bug, owned by Abi, linked to ENG-12.</tspan></text><text class="t l7" x="22" y="185" xml:space="preserve"></text><text class="t l8" x="22" y="204" xml:space="preserve"><tspan fill="#B8F23A" class="b">2</tspan> <tspan class="b">Weeks later, Ravi's AI ports the order screen from the old portal…</tspan></text><text class="t l9" x="22" y="223" xml:space="preserve"><tspan class="d">   …and wants to bring back the old toSapDate():</tspan></text><text class="t l10" x="22" y="242" xml:space="preserve">     <tspan fill="#FF6B6B">- return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;</tspan></text><text class="t l11" x="22" y="261" xml:space="preserve">     <tspan fill="#7EE787">+ return d.toISOString();</tspan></text><text class="t l12" x="22" y="280" xml:space="preserve">   <tspan fill="#79C0FF">AI →</tspan> fixlock_check_edit <tspan class="d">(MCP; in Claude Code the pre-edit hook does this automatically)</tspan></text><text class="t l13" x="22" y="299" xml:space="preserve">   <tspan class="d">│</tspan> verdict: <tspan fill="#F2CC60" class="b">ASK THE DEVELOPER FIRST</tspan></text><text class="t l14" x="22" y="318" xml:space="preserve">   <tspan class="d">│</tspan> • FIX-001 "send SAP DocDate as yyyy-MM-dd" (bug fix by @abinandhmj) — src/sap/date.ts lines 2-3</text><text class="t l15" x="22" y="337" xml:space="preserve">   <tspan class="d">│</tspan>   Why it exists: SAP B1 Service Layer rejects ISO timestamps for DocDate.</text><text class="t l16" x="22" y="356" xml:space="preserve">   <tspan class="d">│</tspan>   This edit removes/rewrites: return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;</text><text class="t l17" x="22" y="375" xml:space="preserve">   <tspan class="d">│</tspan>   Policy: confirm with the developer; the PR will need approval from @abinandhmj.</text><text class="t l18" x="22" y="394" xml:space="preserve"><tspan class="d">   The AI stops and asks Ravi. Most of the time, this is where the bug stays fixed.</tspan></text><text class="t l19" x="22" y="413" xml:space="preserve"></text><text class="t l20" x="22" y="432" xml:space="preserve"><tspan fill="#B8F23A" class="b">3</tspan> <tspan class="b">Suppose Ravi says "go ahead" and commits</tspan></text><text class="t l21" x="22" y="451" xml:space="preserve">   <tspan fill="#79C0FF">$</tspan> git commit -am "feat(orders): port order screen"</text><text class="t l22" x="22" y="470" xml:space="preserve">   <tspan class="d">│</tspan> <tspan fill="#FF6B6B" class="b">LOCKED</tspan>  FIX-001 "send SAP DocDate as yyyy-MM-dd" (bug, owner @abinandhmj) — src/sap/date.ts</text><text class="t l23" x="22" y="489" xml:space="preserve">   <tspan class="d">│</tspan>     → needs approval from @abinandhmj when you open the PR, or restore these lines.</text><text class="t l24" x="22" y="508" xml:space="preserve">   <tspan class="d">│</tspan> ! Heads up: 1 locked change(s). The commit is allowed, but CI will ask for approval.</text><text class="t l25" x="22" y="527" xml:space="preserve"><tspan class="d">   A warning, never a block: local work is never stopped.</tspan></text><text class="t l26" x="22" y="546" xml:space="preserve"></text><text class="t l27" x="22" y="565" xml:space="preserve"><tspan fill="#B8F23A" class="b">4</tspan> <tspan class="b">CI runs fixlock on Ravi's pull request</tspan></text><text class="t l28" x="22" y="584" xml:space="preserve">   <tspan fill="#79C0FF">$</tspan> npx fixlock check --base main</text><text class="t l29" x="22" y="603" xml:space="preserve">   <tspan class="d">│</tspan> <tspan fill="#FF6B6B" class="b">LOCKED</tspan>  FIX-001 "send SAP DocDate as yyyy-MM-dd" (bug, owner @abinandhmj) — src/sap/date.ts</text><text class="t l30" x="22" y="622" xml:space="preserve">   <tspan class="d">│</tspan>     → needs approval from @abinandhmj on the PR, or restore these lines.</text><text class="t l31" x="22" y="641" xml:space="preserve">   <tspan class="d">│</tspan> <tspan fill="#FF6B6B">✖ 1 locked change(s) without approval.</tspan></text><text class="t l32" x="22" y="660" xml:space="preserve">   <tspan fill="#FF6B6B" class="b">exit 1</tspan> <tspan class="d">→ the PR cannot merge. Git itself saw no conflict at all.</tspan></text><text class="t l33" x="22" y="679" xml:space="preserve"></text><text class="t l34" x="22" y="698" xml:space="preserve"><tspan fill="#B8F23A" class="b">5</tspan> <tspan class="b">Abi gets asked to review, and decides</tspan></text><text class="t l35" x="22" y="717" xml:space="preserve"><tspan class="d">   Either Ravi restores the line, or Abi approves the PR because the change is intended:</tspan></text><text class="t l36" x="22" y="736" xml:space="preserve">   <tspan class="d">│</tspan> <tspan fill="#7EE787" class="b">APPROVED</tspan>  FIX-001 "send SAP DocDate as yyyy-MM-dd" (bug, owner @abinandhmj) — src/sap/date.ts</text><text class="t l37" x="22" y="755" xml:space="preserve">   <tspan fill="#7EE787" class="b">exit 0</tspan> <tspan class="d">→ merge allowed, with the owner on record.</tspan></text><text class="t l38" x="22" y="774" xml:space="preserve"></text><text class="t l39" x="22" y="793" xml:space="preserve"><tspan class="b">Without fixlock</tspan>, step 3 merges silently and the SAP bug is back in production.</text><text class="t l40" x="22" y="812" xml:space="preserve"></text><text class="t l41" x="22" y="831" xml:space="preserve">Try it on your repo:  <tspan fill="#B8F23A">npx @abinandhmj/fixlock init</tspan></text><text class="t l42" x="22" y="850" xml:space="preserve">Docs:                 <tspan fill="#79C0FF">https://abinandhmj.github.io/fixlock/</tspan></text></svg>

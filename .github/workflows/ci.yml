name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
        # macOS runners are scarce and fixlock is plain JavaScript with no native code, so one Node
        # version is enough there; Linux and Windows cover all four.
        exclude:
          - { os: macos-latest, node: 18 }
          - { os: macos-latest, node: 20 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # fixlock has zero runtime dependencies, so tests run without npm install.
      - run: npm test
      - name: VS Code extension tests
        run: npm test
        working-directory: extensions/vscode
      - name: Package contents
        shell: bash
        run: npm pack --dry-run 2>&1 | tee pack.txt && ! grep -E "docs/|test/|\.vitepress" pack.txt

  python-package:
    # the PyPI wheel: standalone binary, installed with pip, used on a Python repo with no Node.js on PATH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build binary and wheels
        run: |
          mkdir -p dist/bin
          bun build bin/fixlock.js --compile --minify --target=bun-linux-x64-baseline --outfile dist/bin/fixlock-bun-linux-x64-baseline
          v=$(node -p "require('./package.json').version")
          python python/build_wheels.py --version "$v" --bins dist/bin --out dist/wheels --only bun-linux-x64-baseline
          python -m pip install -q twine && python -m twine check dist/wheels/*
          python -m venv /tmp/venv && /tmp/venv/bin/pip install -q --no-index --find-links dist/wheels "fixlock==$v"
      - name: Use it without Node.js
        run: |
          export PATH=/tmp/venv/bin:/usr/bin:/bin
          test "$(command -v fixlock)" = /tmp/venv/bin/fixlock
          cd "$(mktemp -d)" && git init -q -b main && git config user.email a@b.c && git config user.name A
          printf 'def pay(amount):\n    if amount <= 0:\n        raise ValueError("bad")\n    return amount\n' > pay.py
          git add -A && git commit -qm init
          fixlock init --yes && grep -q '"launcher": "fixlock"' .fixlock/config.json && grep -q '"fixlock hook claude"' .claude/settings.json
          fixlock mark pay.py 2-3 -m "never charge zero" && git add -A && git commit -qm lock
          sed -i 's/<= 0/< 0/' pay.py && git add pay.py
          ! fixlock check --staged --strict
          python -m fixlock --version

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:build

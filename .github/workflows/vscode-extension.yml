name: VS Code extension
on:
  pull_request:
    paths: ['extensions/vscode/**', 'src/**', 'bin/**']
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to'
        type: choice
        options: [nothing (build only), both stores, VS Code Marketplace, Open VSX]
        default: nothing (build only)
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC) to the Marketplace and Open VSX; no stored tokens
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - run: npx --yes @vscode/vsce@3 package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: fixlock-vsix
          path: extensions/vscode/*.vsix
      # Publishing uses trusted publishing (OIDC), so no tokens are stored:
      #   VS Code Marketplace: publisher "algotricz" → Trusted Publishing → policy for
      #     owner AbinandhMJ, repo fixlock, workflow vscode-extension.yml (no environment).
      #     Until that's available, a VSCE_PAT secret works instead (Azure DevOps token with
      #     Marketplace → Manage scope; a token always takes precedence).
      #   Open VSX: namespace "algotricz" → trusted publisher for the same repo and workflow.
      #     Until that's set up, an OVSX_PAT secret works instead (a token always takes precedence).
      # The two stores are independent: one failing (or already having this version) doesn't stop the other.
      - name: Publish to VS Code Marketplace
        id: marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish == 'both stores' || inputs.publish == 'VS Code Marketplace'
        continue-on-error: ${{ inputs.publish == 'both stores' || startsWith(github.ref, 'refs/tags/vscode-v') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then unset VSCE_PAT; npx --yes @vscode/vsce@latest publish --oidc --no-dependencies --packagePath *.vsix
          else npx --yes @vscode/vsce@latest publish --no-dependencies --packagePath *.vsix; fi
      - name: Publish to Open VSX
        id: openvsx
        if: startsWith(github.ref, 'refs/tags/vscode-v') || inputs.publish == 'both stores' || inputs.publish == 'Open VSX'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then unset OVSX_PAT; npx --yes ovsx@latest publish *.vsix --trusted-publishing
          else npx --yes ovsx@latest publish *.vsix; fi
      - name: Fail if the Marketplace publish failed
        if: steps.marketplace.outcome == 'failure'
        run: echo "::error::Publishing to the VS Code Marketplace failed (see that step). Open VSX ran anyway." && exit 1

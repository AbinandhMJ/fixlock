# fixlock as a GitHub Action: works in any repository (Python, Go, Java, Rust, .NET, PHP, Ruby, JS…),
# with no package.json and no npm install. It runs the fixlock in this action's own checkout (zero
# dependencies), so the version is exactly the tag you reference.
#
#   on: { pull_request: {}, pull_request_review: { types: [submitted, dismissed] } }
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     fixlock:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: AbinandhMJ/fixlock@v0.10.0
name: fixlock by Algotricz
description: Stop AI coding assistants and teammates from silently undoing bug fixes. Fails the PR until the fix owner approves.
author: Algotricz
branding:
  icon: lock
  color: green
inputs:
  base:
    description: Branch or ref to compare against. Defaults to the pull request's base branch.
    required: false
    default: ''
  comment:
    description: Post (and update) a PR comment listing affected locks and who must approve.
    required: false
    default: 'true'
  notify:
    description: Update linked issues in your tracker (Linear, ClickUp, Notion, webhook) when a fix is reverted.
    required: false
    default: 'false'
  run-tests:
    description: Run the test linked to each changed lock. A passing test that the PR didn't change satisfies the lock (no approval needed); a failing one says the fix is broken. Set up your language and install dependencies in earlier steps.
    required: false
    default: 'false'
  alert:
    description: Post to Slack / Teams / a webhook when a PR changes a locked fix, is approved, fails a lock's test, or is merged while blocked. Set FIXLOCK_SLACK_WEBHOOK, FIXLOCK_TEAMS_WEBHOOK or FIXLOCK_ALERT_WEBHOOK in the step's env (from secrets). Add "closed" to the workflow's pull_request types for merged-while-blocked alerts.
    required: false
    default: 'false'
  judge:
    description: Ask an AI model whether each changed lock's fix still works, and show its answer (advice only; it never approves or blocks). Needs ANTHROPIC_API_KEY (or judge settings in .fixlock/config.json) in the step's env.
    required: false
    default: 'false'
  args:
    description: Extra arguments for `fixlock check`.
    required: false
    default: ''
  github-token:
    description: Token used to read PR approvals and post the comment.
    required: false
    default: ${{ github.token }}
outputs:
  markdown:
    description: Path of the markdown report.
    value: ${{ steps.check.outputs.markdown }}
runs:
  using: composite
  steps:
    - name: Check Node.js
      shell: bash
      run: |
        if ! command -v node >/dev/null || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 18 ]; then
          echo "::error::fixlock needs Node.js 18+ on the runner. Add actions/setup-node before this step."; exit 1
        fi
    - name: Fetch the base branch
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        base="${BASE_INPUT:-${BASE_REF:-main}}"; base="${base#origin/}"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow checkout: use actions/checkout with fetch-depth: 0 for exact results."
          git fetch --no-tags --deepen=500 origin HEAD >/dev/null 2>&1 || true
        fi
        git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}" >/dev/null 2>&1 || true
        echo "FIXLOCK_BASE=origin/${base}" >> "$GITHUB_ENV"
    - id: check
      name: fixlock check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NOTIFY: ${{ inputs.notify }}
        RUN_TESTS: ${{ inputs.run-tests }}
        JUDGE: ${{ inputs.judge }}
        ALERT: ${{ inputs.alert }}
        EXTRA: ${{ inputs.args }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        out="${RUNNER_TEMP:-/tmp}/fixlock.md"
        echo "markdown=$out" >> "$GITHUB_OUTPUT"
        flags=(check --base "$FIXLOCK_BASE" --markdown "$out")
        [ -n "$PR_NUMBER" ] && flags+=(--pr "$PR_NUMBER")
        [ "$NOTIFY" = "true" ] && flags+=(--notify)
        [ "$RUN_TESTS" = "true" ] && flags+=(--run-tests)
        [ "$JUDGE" = "true" ] && flags+=(--judge)
        [ "$ALERT" = "true" ] && flags+=(--alert)
        # shellcheck disable=SC2206
        [ -n "$EXTRA" ] && flags+=($EXTRA)
        status=0
        node "$GITHUB_ACTION_PATH/bin/fixlock.js" "${flags[@]}" || status=$?
        [ -s "$out" ] || echo "fixlock could not run; see the job log." > "$out"
        printf '\n<sub>[fixlock](https://abinandhmj.github.io/fixlock/) · fixed stays fixed · a product of Algotricz</sub>\n' >> "$out"
        exit $status
    - name: PR comment
      if: always() && inputs.comment == 'true' && github.event.pull_request.number && github.event.action != 'closed' && steps.check.outputs.markdown != ''
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: fixlock
        path: ${{ steps.check.outputs.markdown }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

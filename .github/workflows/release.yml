# Publishes a release for a vX.Y.Z tag. Usually started by the release bot (release-bot.yml) when its
# "chore(release)" PR is merged; pushing a tag by hand works too (npm version minor && git push --follow-tags).
# 1. npm (@abinandhmj/fixlock) with provenance
# 2. PyPI (fixlock): wheels with a standalone binary for Linux, macOS and Windows, plus a fallback wheel
# 3. The GitHub release: notes, an SBOM, the standalone binaries and SHA256SUMS, each with a signed
#    build attestation (gh attestation verify <file> -R AbinandhMJ/fixlock). See SECURITY.md.
# npm and PyPI use trusted publishing (OIDC), so no token is stored anywhere:
#   npmjs.com → package Settings → Trusted Publisher → GitHub Actions: AbinandhMJ / fixlock / release.yml,
#     "npm publish" allowed. Needs npm >= 11.5.1 (Node 24 ships it).
#   pypi.org → Publishing → trusted publisher: project fixlock, owner AbinandhMJ, repo fixlock,
#     workflow release.yml, environment pypi.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # the release bot starts it on the new tag (gh workflow run release.yml --ref vX.Y.Z)
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance / trusted publishing / signed attestations
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # never cache in release builds
      - name: npm supports trusted publishing
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm --version)"
      - name: Runs on a version tag that matches package.json
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo "::error::Run this on a vX.Y.Z tag, not a branch."; exit 1; }
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      # Every step can run again: "Re-run failed jobs" finishes a release that stopped halfway.
      - name: npm publish
        run: |
          if npm view "@abinandhmj/fixlock@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "::notice::@abinandhmj/fixlock@${GITHUB_REF_NAME#v} is already on npm."
          else
            npm publish --provenance --access public   # OIDC: no NODE_AUTH_TOKEN
          fi
      - name: SBOM (CycloneDX)
        # From the lockfile: the release job installs nothing (zero runtime dependencies), and npm sbom
        # stops on uninstalled devDependencies otherwise. Without node_modules npm names the package after
        # the folder, so set the name from package.json.
        run: |
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > fixlock.cdx.json
          node -e "const f='./fixlock.cdx.json', j=require(f); j.metadata.component.name=require('./package.json').name; require('fs').writeFileSync(f, JSON.stringify(j, null, 2))"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fixlock.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" fixlock.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md fixlock.cdx.json
          fi

  pypi:
    needs: publish            # only after the tests passed and npm has the same version
    runs-on: ubuntu-latest
    environment: pypi         # PyPI trusted publisher is bound to this environment
    permissions:
      contents: write         # add the binaries to the GitHub release
      id-token: write         # PyPI trusted publishing, signed attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build standalone binaries
        run: |
          mkdir -p dist/bin
          for t in bun-linux-x64-baseline bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl \
                   bun-darwin-x64 bun-darwin-arm64 bun-windows-x64-baseline bun-windows-arm64; do
            ext=""; case "$t" in bun-windows*) ext=".exe";; esac
            bun build bin/fixlock.js --compile --minify --target="$t" --outfile "dist/bin/fixlock-$t$ext"
          done
      - name: Smoke-test the Linux binary
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(dist/bin/fixlock-bun-linux-x64-baseline --version)" = "$v"
          test "$(dist/bin/fixlock-bun-linux-x64-baseline languages app.py | tail -1 | grep -o python)" = python
      - name: Build wheels
        run: python python/build_wheels.py --version "${GITHUB_REF_NAME#v}" --bins dist/bin --out dist/wheels
      - name: Check wheels
        run: |
          python -m pip install -q twine
          python -m twine check dist/wheels/*
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --no-index --find-links dist/wheels "fixlock==${GITHUB_REF_NAME#v}"
          test "$(/tmp/venv/bin/fixlock --version)" = "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: cd dist/bin && sha256sum fixlock-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bin/fixlock-*
            dist/wheels/*.whl
      - name: Add the binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/bin/fixlock-* dist/bin/SHA256SUMS --clobber
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/wheels
          skip-existing: true  # a re-run doesn't fail on files already uploaded
          attestations: true   # PEP 740: PyPI shows each file's signed provenance


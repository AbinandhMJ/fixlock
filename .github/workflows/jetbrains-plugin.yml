name: JetBrains plugin
on:
  pull_request:
    paths: ['extensions/jetbrains/**', 'src/commands.js', '.github/workflows/jetbrains-plugin.yml']
  push:
    tags: ['jetbrains-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to'
        type: choice
        options: [nothing (build only), JetBrains Marketplace]
        default: nothing (build only)
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release for a jetbrains-v tag
      id-token: write   # signed build attestation for the plugin zip
      attestations: write
    defaults:
      run:
        working-directory: extensions/jetbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Free disk space for the IDEs the verifier downloads
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Test
        run: ./gradlew test --stacktrace
      - name: Build
        run: ./gradlew buildPlugin
      - name: Verify against IntelliJ IDEA, PyCharm, WebStorm and the recommended IDEs
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixlock-jetbrains
          path: extensions/jetbrains/build/distributions/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-verifier-report
          path: extensions/jetbrains/build/reports/pluginVerifier
          if-no-files-found: ignore
      # Publishing: the first version is uploaded by hand at https://plugins.jetbrains.com/plugin/add
      # (Marketplace requires that). After that, add a JETBRAINS_MARKETPLACE_TOKEN secret (a permanent
      # token from https://plugins.jetbrains.com/author/me/tokens) and run this workflow with
      # "JetBrains Marketplace", or push a jetbrains-v* tag. Signing is optional: add
      # JETBRAINS_CERTIFICATE_CHAIN, JETBRAINS_PRIVATE_KEY and JETBRAINS_PRIVATE_KEY_PASSWORD to sign.
      - name: Publish to JetBrains Marketplace
        if: (github.event_name == 'workflow_dispatch' && inputs.publish == 'JetBrains Marketplace') || startsWith(github.ref, 'refs/tags/jetbrains-v')
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "::error::Add the JETBRAINS_MARKETPLACE_TOKEN secret first (see the comment above this step)."
            exit 1
          fi
          v=$(grep -E '^pluginVersion' gradle.properties | sed 's/.*= *//')
          # Marketplace refuses a version it already has (such as one uploaded by hand): skip it.
          if curl -fsS "https://plugins.jetbrains.com/api/plugins/36267/updates?size=100" | grep -q "\"version\":\"$v\""; then
            echo "fixlock $v is already on JetBrains Marketplace; not publishing it again."
          else
            ./gradlew publishPlugin
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/jetbrains-v')
        with:
          subject-path: extensions/jetbrains/build/distributions/*.zip
      - name: GitHub release with the plugin zip
        if: startsWith(github.ref, 'refs/tags/jetbrains-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#jetbrains-v}"
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" build/distributions/*.zip --clobber \
            || gh release create "$TAG" build/distributions/*.zip --title "JetBrains plugin $v" --notes-file notes.md --latest=false

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Actions are pinned to commit SHAs (with the version in a comment); this keeps them current.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Only the docs site has dependencies; fixlock itself has none.
    groups:
      docs:
        patterns: ["*"]
